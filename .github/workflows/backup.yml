name: Záloha fotiek z archívu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/backup_archive_images.py
      - name: Uložiť fotky
        run: |
          git config user.name "zilinabears-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data assets/archive
          git diff --cached --quiet || (git commit -m "Záloha fotiek z archívu" && git pull --rebase && git push)
