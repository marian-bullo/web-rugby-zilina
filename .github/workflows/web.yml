name: Aktualizácia a nasadenie webu

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # každé 3 hodiny
  workflow_dispatch:
    inputs:
      all:
        description: "Stiahnuť celú históriu z FB a IG (prvé spustenie)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Stiahnuť príspevky z Facebooku a Instagramu
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python scripts/fetch_social.py ${{ inputs.all && '--all' || '' }}
      - name: Uložiť zmeny do repozitára
        run: |
          git config user.name "zilinabears-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data assets/posts
          git diff --cached --quiet || (git commit -m "Nové príspevky zo sociálnych sietí" && git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
